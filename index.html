<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
.game{
    align-items: center;
    justify-content: center;
    display: flex;
    flex-direction: column;
    width: 70svh;
    height: 85svh;
    background-color:#003049 ;
    color: #669bbc;
    font-family: calibri;
    border-radius: 45px;
    margin-top: 1.5rem;
}
.boxes{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    align-items: center;
    justify-content: center;
    margin-bottom:1rem;
    gap: 0.8rem;

}
.btns{
    width: 6rem;
    height: 6rem;
    background-color: #fdf0d5;
    font-size: 80px;
    border-radius: 22px;
    color: #669bbc;
    border: none;
}
body{
    display: flex;
    justify-content: center;
}
.over button{
    color:#003049;
    background-color:#fdf0d5;
    height: 40px;
    width: 80px;
    border-radius: 12px;
    font-weight: 550;
    font-family: calibri;
    border: none;
    padding: 5px;
    font-size: 18px;
}
.over{
    margin-top: 5px;
}
.msg{
    margin: 5px;
    color: #fdf0d5;
    font-weight: 500;
}

@media screen and (max-width: 650px) {
    .game {
        width: 80svw;
        height: 85svh;
        /* margin-top: 4rem; */
    }
    
}
    </style>
    <title>Tic Tac Toe</title>
</head>
<body>
    <div class="game">
        <h1>Tic Tac Toe</h1>
        <div class="boxes">
            <button class="btns"></button>
            <button class="btns"></button>
            <button class="btns"></button>
            <button class="btns"></button>
            <button class="btns"></button>
            <button class="btns"></button>
            <button class="btns"></button>
            <button class="btns"></button>
            <button class="btns"></button>
        </div>
        <div class="over">
        <button class="restart">Restart</button>
    </div>
    <div class="msg"></div>
    </div>
    <script>
        let turno = true;
let bouttons = document.querySelectorAll(".btns");
let restart = document.querySelector('.restart');
let win = document.querySelector('.msg')
bouttons.forEach((box) => {
    box.addEventListener("click", () => {
        if (turno) {
            box.innerText = "O";
            turno = false;
        } else {
            box.innerText = "X";
            turno = true;
        }
        box.disabled = true;
        winner();
    })
})
let wins = [
    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],
    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],
    [0, 4, 8],
    [2, 4, 6]
]

const winner = () => {
    for (let win of wins) {
        let pos1 = bouttons[win[0]].innerText;
        let pos2 = bouttons[win[1]].innerText;
        let pos3 = bouttons[win[2]].innerText;
        if (pos1 !== '' && pos1 === pos2 && pos2 === pos3) {
            let winner = document.querySelector('.msg');
            winner.innerText = (`----- ${pos1}  WINS -----`)
            disable();
            return

        }
    }

    let allFilled = true;
        bouttons.forEach((box) => {
            if (box.innerText === '') {
                allFilled = false;
            }
        });

        if (allFilled) {
            win.innerText = "----- Draw! -----";
            disable();
        }
}
const disable = () => {
    let boxes = document.querySelectorAll('.btns')
    for (let box of boxes) {
        box.disabled = true;
    }
}
const enable = () => {
    let boxes = document.querySelectorAll('.btns')
    for (let box of boxes) {
        box.disabled = false;
        box.innerText = ""
    }
}

const reset = () => {
    turno = true;
    enable();
    winner.innerText = ""
    win.innerText = ""

}
restart.addEventListener('click', reset);
    </script>
</body>
</html>
